# =============================================================================
# district_config.yml — the single adaptation surface for the pipeline.
# New district = copy this file and edit the knobs; the code doesn't change.
# Each block notes the tier that owns the decision.
# =============================================================================

district: Springfield Public Schools
year: "2025-26"
raw_data_folder_path: "District Partners/Springfield MA/Springfield - 26 - HS Scheduling/1. Data & Analysis - Secure/For R"
raw_files:
  cs_raw:              "/0. Raw Data/student_course_schedules.csv"
  stu_demographics:    "/0. Raw Data/student_enrollment_and_demographic.xlsx"
  course_coding:       "/1. Coding/cs_course_coding.xlsx"

# ---- 01 — intake --------------------------------------------------------
intake:
  enrollment_type: snapshot      # has enter/exit dates; snapshot logic is stage 02
  snapshot_date: null
  time_field: expression           # Detroit encodes time in "Period Expression"

# ---- 01 prep recipe (promoted from 01_explore.qmd) ----------------------
# The recipe that turns the raw 2.6M-row export into the prepped checkpoint
# (01_course_data_post_explore.csv). This is the source of truth; the exported
# file is its cached output. Change the recipe -> re-export.
column_map:
  course_schedule:
    D_location_id:       Sch_ID
    D_location_name:     Sch_Name
    D_stu_id:            Stu_ID
    D_room:              Room_Nu
    D_course_id:         Crs_ID
    D_course_name:       Crs_Name
    D_course_section:    Section
    D_period:            Period
    D_term:              Term
    D_expression:        Rotation      # gotcha: "Rotation" is the expression
    D_employee_id:       Teacher_ID
    D_course_section_id: SECTIONID
    D_year_id:           YEAR_ID
  demographics:
    D_stu_id:            Stu_ID
    D_school_year:       School_Year
    D_stu_grade:         "Current Grade Level ID"
    D_location_id:       "SIS School ID"
    D_stu_swd_flag:      "Stu_SWD flag"
    D_stu_ell_flag:      "Stu_ELL flag"
    D_stu_poverty_flag:  "Stu_Poverty Flag"

stu_demographics_join:             # JOIN: merge student demographics onto cs_prepped
  key: D_stu_id                    # join key (post-rename, both sides)
  brings_in: [D_stu_grade, D_stu_swd_flag, D_stu_ell_flag, D_stu_poverty_flag]
  recode:                          # optional: recode values post-rename (raw value -> new value) DELETE if you don't need!
    D_stu_swd_flag: {"Y": 1, "N": 0}
    D_stu_ell_flag: {"Y": 1, "N": 0}
    D_stu_poverty_flag: {"Y": 1, "N": 0}

scope:                             # FILTER decisions
  drop_when_null: ["D_stu_id", "D_stu_grade"]   # post-rename names; filters away students missing from stu_demographics


# ---- 01 — data inventory ------------------------------------------------
data_inventory:
  demographics:       received    # SWD/ELL/FRL + student grade level — expected later
  proficiency:        received
  teacher_experience: received

# ---- 02 — coding --------------------------------------------------------
coding:
  uncoded_flag_threshold_pct: 2
  # Detroit coding inputs: D_sced_subject_code, AP Flag, Accelerated Course Flag,
  #                        Virtual Flag, Virtual Delivery Type
relevant_periods:
  include: []                      # TBD in stage 02 — time is an expression, not yet parsed into periods

# ---- 03 — modeling-ready ------------------------------------------------
class_id:
  recipe: [D_location_id, D_term, D_expression]   # + section field once confirmed
  include_section: false
weights:
  term:          { 3500: 1.0, 3501: 0.5, 3502: 0.5 }
  term_interval: { 3500: [0, 1], 3501: [0, 0.5], 3502: [0.5, 1] }
  default_period_weight: 1.0
db_resolution:
  student: full
  teacher: full
  class:   full
teacher_db:
  consolidate_max_size: 35
  exempt_subjects: [Art, PE]

# ---- 04 — precision-ready ----------------------------------------------
self_contained:
  swd_ell_threshold_pct: 50        # flag only; metrics decide
buckets:
  class_size: [[0, 6], [7, 12], [13, 18], [19, 35], [36, 40], [41, 50], [51, null]]
